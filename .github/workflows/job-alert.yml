name: Job alerts

on:
  schedule:
    # Toutes les heures. LinkedIn a durci ses limites : à 30 min, il coupait en cours de
    # passage. GitHub peut retarder une exécution de quelques minutes.
    - cron: "7 * * * *"
  workflow_dispatch: # bouton "Run workflow" pour lancer à la main

concurrency:
  group: job-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Les pauses anti-blocage et les reprises après 429 allongent le passage (~15 min au pire).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Mémoire des offres déjà envoyées (évite les doublons d'un passage à l'autre)
      - name: Restore seen jobs
        uses: actions/cache/restore@v6
        with:
          path: seen_jobs.json
          key: seen-jobs-${{ github.run_id }}
          restore-keys: seen-jobs-

      - name: Search and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          # Jooble délivre une clé par pays ; n'ajoutez que les Secrets dont vous disposez.
          JOOBLE_API_KEY_FR: ${{ secrets.JOOBLE_API_KEY_FR }}
          JOOBLE_API_KEY_UK: ${{ secrets.JOOBLE_API_KEY_UK }}
          JOOBLE_API_KEY_MA: ${{ secrets.JOOBLE_API_KEY_MA }}
          JOOBLE_API_KEY_NG: ${{ secrets.JOOBLE_API_KEY_NG }}
          JOOBLE_API_KEY_ZA: ${{ secrets.JOOBLE_API_KEY_ZA }}
        run: python job_alert.py

      - name: Save seen jobs
        if: always()
        uses: actions/cache/save@v6
        with:
          path: seen_jobs.json
          key: seen-jobs-${{ github.run_id }}
